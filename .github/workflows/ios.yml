name: Gerar app do iPhone (IPA)
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Gerar projeto
        run: cd ios && xcodegen generate
      - name: Compilar
        run: |
          cd ios
          xcodebuild -project TrofeuEspelho.xcodeproj -target TrofeuEspelho -configuration Release -sdk iphoneos \
            SYMROOT=$PWD/build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Release-iphoneos/TrofeuEspelho.app Payload/
          zip -qry TrofeuEspelho.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TrofeuEspelho-iPhone
          path: TrofeuEspelho.ipa
      - name: Publicar IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-iphone -y --cleanup-tag || true
          gh release create app-iphone TrofeuEspelho.ipa --title "Trofeu Espelho - app do iPhone" --notes "Build ${{ github.run_number }}"
