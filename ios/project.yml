name: TrofeuEspelho
options:
  bundleIdPrefix: com.trofeu
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TrofeuEspelho:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: TrofeuBroadcast
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Trofeu Espelho
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Usado para enviar a tela do iPhone para o seu PC.
        NSBonjourServices: [_trofeu._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trofeu.espelho
        TARGETED_DEVICE_FAMILY: "1"
  TrofeuBroadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast]
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Trofeu Espelho
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSLocalNetworkUsageDescription: Usado para enviar a tela do iPhone para o seu PC.
        NSBonjourServices: [_trofeu._tcp]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trofeu.espelho.broadcast
        TARGETED_DEVICE_FAMILY: "1"
